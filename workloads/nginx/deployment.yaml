---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-nginx
  namespace: devops-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-nginx
  template:
    metadata:
      labels:
        app: devops-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
